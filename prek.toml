default_stages = ["pre-commit"]
default_install_hook_types = ["pre-commit", "pre-push"]

[[repos]]
repo = "local"

# NOTE: Rust
[[repos.hooks]]
id = "cargo-fmt"
name = "cargo fmt"
entry = "cargo fmt --all"
language = "system"
types = ["rust"]
pass_filenames = false

[[repos.hooks]]
id = "cargo-sort"
name = "cargo sort"
entry = "cargo sort --no-format --workspace"
language = "system"
files = "(^|/)Cargo\\.toml$"
pass_filenames = false

[[repos.hooks]]
id = "cargo-clippy"
name = "cargo clippy"
entry = "cargo clippy"
args = [
    "--all-features",
    "--all-targets",
    "--manifest-path",
    "Cargo.toml",
    "--",
    "-D",
    "warnings",
]
language = "system"
types = ["rust"]
pass_filenames = false
stages = ["pre-push"]

# NOTE: Toml
[[repos.hooks]]
id = "taplo-format"
name = "taplo format"
entry = "taplo format"
language = "system"
pass_filenames = false
types = ["toml"]
