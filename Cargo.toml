[package]
name = "pompiliusd"
version = "0.1.0"
edition = "2024"

[dependencies]
dirs = "6"
reqwest = { version = "0.13.2", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.141"
thiserror = "2.0.18"
tokio = { version = "1.52.1", features = ["full"] }
toml = "1.1"
zbus = { version = "5.14.0", features = ["tokio"] }

[lints.rust]
unsafe_code = "forbid"
